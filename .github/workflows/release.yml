name: Version and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        with:
          release-type: node
          package-name: miriam-campos-photography
          target-branch: main
          token: ${{ secrets.GITHUB_TOKEN }}
